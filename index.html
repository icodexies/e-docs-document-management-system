<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="E-Docs — upload PDFs, route them to the right signatories, and collect signatures with a verifiable audit trail."
    />
    <meta name="theme-color" content="#0B1330" />
    <script>
      // Apply the saved theme before first paint. The member display size is
      // applied by its provider so public pages can never inherit it.
      (function () {
        try {
          var savedTheme = localStorage.getItem("edocs-theme");
          var dark =
            savedTheme === "dark" ||
            (!savedTheme &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute("content", "#0a0f21");
          }
        } catch (error) {
          // Storage can be blocked; the provider uses its default.
        }
      })();
    </script>
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SUPABASE_URL%" />
    <title>E-Docs — Document Signing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
